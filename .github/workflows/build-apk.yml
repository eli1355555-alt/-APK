name: Build APK
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true
      callback_url:
        description: "Optional Telegram completion endpoint"
        required: false

permissions: {}

concurrency:
  group: apk-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack ZIP
        run: |
          [[ "$BUILD_ID" =~ ^[a-z0-9-]{1,90}$ ]] || exit 1
          B=builds/$BUILD_ID
          mkdir -p web && unzip -q "$B/app.zip" -d web
          F=$(find web -maxdepth 4 \( -name package.json -o -name index.html \) -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          echo "SRC=$(dirname "$F")" >> $GITHUB_ENV
          echo "APP_NAME=$(jq -r .appName $B/config.json)" >> $GITHUB_ENV
          echo "APP_ID=$(jq -r .appId $B/config.json)" >> $GITHUB_ENV
          echo "V_CODE=$(jq -r .versionCode $B/config.json)" >> $GITHUB_ENV
          echo "V_NAME=$(jq -r .versionName $B/config.json)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$SRC"
          if [ -f package.json ]; then
            npm install --no-audit --no-fund
            if jq -e '.scripts.build' package.json > /dev/null; then npm run build; fi
          fi
          for d in dist build out www .; do
            if [ -f "$d/index.html" ]; then echo "WEBDIR=$PWD/$d" >> $GITHUB_ENV; break; fi
          done

      - name: Create Capacitor project
        run: |
          mkdir cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --no-audit --no-fund
          mkdir www && cp -r "$WEBDIR"/. www/ && rm -rf www/node_modules
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $V_CODE/" $G
          sed -i "s/versionName \".*\"/versionName \"$V_NAME\"/" $G
          ICON=../builds/$BUILD_ID/icon.png
          if [ -f "$ICON" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              cp "$ICON" $d/ic_launcher.png; cp "$ICON" $d/ic_launcher_round.png
              rm -f $d/ic_launcher_foreground.png
            done
          fi

      - name: Build Gradle
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: "Build ${{ inputs.build_id }}"
          files: apk/app-debug.apk

  notify:
    needs: [build, publish]
    if: ${{ always() && inputs.callback_url != '' }}
    runs-on: ubuntu-latest
    environment: apk-delivery
    permissions:
      id-token: write
    steps:
      - name: Return result to Telegram
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          BUILD_ID: ${{ inputs.build_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, time
          url = os.environ['CALLBACK_URL']
          origin = 'https://project--869a0e60-89ec-42de-bb1a-57fc47a2638e-dev.lovable.app'
          if not url.startswith(origin + '/api/public/telegram/complete/'):
              raise RuntimeError('Invalid callback URL')
          request = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=' + urllib.parse.quote(origin, safe=''),
              headers={'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          token = json.load(urllib.request.urlopen(request))['value']
          print('::add-mask::' + token)
          body = json.dumps({'build_id': os.environ['BUILD_ID'], 'run_id': int(os.environ['RUN_ID'])}).encode()
          for attempt in range(5):
              try:
                  request = urllib.request.Request(url, data=body, headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
                  urllib.request.urlopen(request, timeout=120).read()
                  break
              except Exception:
                  if attempt == 4: raise RuntimeError('Telegram delivery failed; see website build history') from None
                  time.sleep(15)
          PY
