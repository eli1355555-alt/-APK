name: Build APK
run-name: Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack ZIP
        run: |
          B=builds/${{ inputs.build_id }}
          mkdir -p web && unzip -q "$B/app.zip" -d web
          PKG=$(find web -maxdepth 6 -name package.json -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          IDX=$(find web -maxdepth 6 -name index.html -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -n "$PKG" ]; then
            echo "SRC=$(dirname "$PKG")" >> $GITHUB_ENV
          elif [ -n "$IDX" ]; then
            echo "SRC=$(dirname "$IDX")" >> $GITHUB_ENV
          else
            echo "SRC=$PWD/web" >> $GITHUB_ENV
          fi
          echo "APP_NAME=$(jq -r '.appName // "MyApp"' $B/config.json)" >> $GITHUB_ENV
          echo "APP_ID=$(jq -r '.appId // "com.app.builder"' $B/config.json)" >> $GITHUB_ENV
          echo "V_CODE=$(jq -r '.versionCode // 1' $B/config.json)" >> $GITHUB_ENV
          echo "V_NAME=$(jq -r '.versionName // "1.0.0"' $B/config.json)" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd "$SRC"
          if [ -f package.json ]; then
            npm install --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund
            if jq -e '.scripts.build' package.json > /dev/null; then npm run build; fi
          fi
          FOUND_WEB=""
          for d in dist build out www public .; do
            if [ -f "$d/index.html" ]; then
              FOUND_WEB="$PWD/$d"
              break
            fi
          done
          if [ -z "$FOUND_WEB" ]; then
            DEEP_IDX=$(find "$PWD" -maxdepth 4 -name index.html -not -path '*/node_modules/*' | head -1)
            if [ -n "$DEEP_IDX" ]; then
              FOUND_WEB="$(dirname "$DEEP_IDX")"
            fi
          fi
          if [ -z "$FOUND_WEB" ]; then
            mkdir -p "$PWD/dist"
            printf '<!doctype html><html><head><meta charset="utf-8"><title>App</title></head><body><div id="root"></div></body></html>\n' > "$PWD/dist/index.html"
            FOUND_WEB="$PWD/dist"
          fi
          echo "WEBDIR=$FOUND_WEB" >> $GITHUB_ENV

      - name: Create Capacitor project
        run: |
          mkdir -p cap && cd cap
          npm init -y > /dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 --no-audit --no-fund
          mkdir -p www && cp -r "$WEBDIR"/. www/ && rm -rf www/node_modules

          if [ ! -f www/index.html ]; then
            FIRST_HTML=$(find www -name "*.html" | head -1)
            if [ -n "$FIRST_HTML" ]; then
              cp "$FIRST_HTML" www/index.html
            else
              printf '<!doctype html><html><head><meta charset="utf-8"><title>App</title></head><body><div id="root"></div></body></html>\n' > www/index.html
            fi
          fi

          SAFE_APP_ID=$(echo "$APP_ID" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9.]/_/g; s/\.\.*/./g; s/^\.//; s/\.$//')
          case "$SAFE_APP_ID" in *.*) ;; *) SAFE_APP_ID="com.app.${SAFE_APP_ID:-myapp}" ;; esac
          SAFE_APP_NAME=$(echo "${APP_NAME:-MyApp}" | tr -d '"\\')
          [ -z "$SAFE_APP_NAME" ] || [ "$SAFE_APP_NAME" = "null" ] && SAFE_APP_NAME="MyApp"

          npx cap init "$SAFE_APP_NAME" "$SAFE_APP_ID" --web-dir www
          if [ ! -d android ]; then
            npx cap add android
          fi
          mkdir -p android/app/src/main/assets
          npx cap sync android

          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $V_CODE/" $G
          sed -i "s/versionName \".*\"/versionName \"$V_NAME\"/" $G
          ICON=../builds/${{ inputs.build_id }}/icon.png
          if [ -f "$ICON" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in android/app/src/main/res/mipmap-*; do
              cp "$ICON" $d/ic_launcher.png
              cp "$ICON" $d/ic_launcher_round.png
              rm -f $d/ic_launcher_foreground.png
            done
          fi

      - name: Build Gradle
        run: |
          cd cap/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: "${{ env.APP_NAME }} ${{ env.V_NAME }}"
          files: cap/android/app/build/outputs/apk/debug/app-debug.apk
